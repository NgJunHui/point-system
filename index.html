<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)">
  <title>Team Shuffle</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='9' cy='16' r='6' fill='%23007AFF'/%3E%3Ccircle cx='23' cy='9.5' r='6' fill='%23FF9500'/%3E%3Ccircle cx='23' cy='22.5' r='6' fill='%2334C759'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" class="app"></main>

  <dialog id="confirm" class="alert" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <div class="alert-body">
      <h2 id="confirm-title" class="alert-title"></h2>
      <p id="confirm-message" class="alert-message"></p>
    </div>
    <div class="alert-actions">
      <button type="button" class="alert-btn" data-result="cancel">Cancel</button>
      <button type="button" class="alert-btn" data-result="confirm">OK</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span class="toast-text"></span>
    <button type="button" class="toast-undo">Undo</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
